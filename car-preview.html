type="button" id="prev" aria-label="Назад">‹</button><button type="button" id="next" aria-label="Вперёд">›</button></div></div><div class="body"><h2 id="heading"></h2><p class="narrative" id="narrative"></p><div class="question">💡 <span id="prompt"></span></div><div class="actions"><button id="speak">🔊 <span id="speakLabel">Послушать</span></button><button id="lastNext">→ <span id="nextLabel">Следующая страница</span></button></div></div><p class="note" id="disclaimer"></p><p class="detail" id="detail"></p></article></main><script>
(()=>{'use strict';const pages={ru:[['Знакомимся с автомобилем','У автомобиля есть кузов, колёса, двигатель, руль и тормоза. Все эти части помогают машине двигаться и останавливаться.','Какая часть автомобиля тебя заинтересовала?'],['Откуда берётся движение?','Двигатель помогает автомобилю двигаться. В бензиновом двигателе топливо выделяет энергию, которая приводит в движение детали двигателя. Электромобиль использует энергию аккумулятора для работы электродвигателя.','Хочешь узнать, что происходит внутри двигателя?'],['Почему крутятся колёса?','У многих автомобилей двигатель передаёт вращение ведущим колёсам через систему деталей. Шины сцепляются с дорогой — и автомобиль едет.','А почему колёса круглые?'],['Как машина поворачивает и тормозит?','Поворачивая руль, водитель изменяет направление передних колёс у большинства легковых автомобилей. Тормоза замедляют вращение колёс, помогая остановиться.','Что помогает машине остановиться?'],['Автомобиль и безопасность','В машине важно пристёгиваться ремнём безопасности и ездить в подходящем детском кресле. Управлять настоящим автомобилем могут только взрослые, у которых есть право на вождение.','Зачем пристёгиваться в автомобиле?']],en:[['Meet the Car','A car has a body, wheels, an engine, a steering wheel and brakes. These parts work together to help it move and stop.','Which part of the car interests you most?'],['Where Does Motion Come From?','An engine helps a car move. In a petrol engine, burning fuel releases energy that moves parts inside the engine. An electric car uses energy stored in a battery to run an electric motor.','Would you like to know what happens inside an engine?'],['Why Do the Wheels Turn?','In many cars, the engine sends rotation to the driving wheels through a system of mechanisms. Tyres grip the road, and the car moves.','Why are wheels round?'],['How Does a Car Turn and Stop?','In most passenger cars, turning the steering wheel changes the direction of the front wheels. The brakes slow the wheels down and help the car stop.','What helps a car stop?'],['Cars and Safety','In a car, it is important to use a seat belt and a suitable child safety seat. Only adults who are legally allowed to drive should operate a real car.','Why do we wear seat belts?']]};const words={ru:{title:'Как устроен автомобиль',back:'Книжная полка',page:'Страница',of:'из',listen:'Послушать',next:'Следующая страница',end:'На книжную полку',disclaimer:'Это публичная демонстрация чтения: пять страниц и озвучивание средствами браузера. Свободные ответы DeepSeek и распознавание детской речи здесь не подключены — они работают в локальном Flask-MVP.',detail:'Листай пальцем или стрелками. Внутри книги — учебные тексты, созданные для проекта «Книга оживает».'},en:{title:'How Cars Work',back:'Bookshelf',page:'Page',of:'of',listen:'Listen',next:'Next page',end:'Back to bookshelf',disclaimer:'This is a public reading preview: five pages with browser narration. Live DeepSeek responses and speech recognition are not connected here; they run in the local Flask MVP.',detail:'Swipe or use the arrows to turn pages. This educational content was created for The Book Comes Alive project.'}};let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ru',idx=0;const $=id=>document.getElementById(id);function focus(){const f=$('focus');let a=[['', ''],['<circle cx="445" cy="310" r="58" fill="#f9d14b" opacity=".42" stroke="#f3a51f" stroke-width="8"/>',''],['<circle cx="272" cy="411" r="100" fill="none" stroke="#f9d14b" stroke-width="13"/><circle cx="670" cy="411" r="100" fill="none" stroke="#f9d14b" stroke-width="13"/>',''],['<path d="M420 216l40 0" stroke="#f9d14b" stroke-width="17" stroke-linecap="round"/><circle cx="670" cy="411" r="90" fill="none" stroke="#f9d14b" stroke-width="12"/>',''],['<path d="M247 219H372" stroke="#f9d14b" stroke-width="16" stroke-linecap="round"/><path d="M562 220H671" stroke="#f9d14b" stroke-width="16" stroke-linecap="round"/>','']];f.innerHTML=a[idx][0];}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}function render(){const w=words[lang],p=pages[lang][idx];document.documentElement.lang=lang;document.title=w.title+' — Книга оживает';$('title').textContent=w.title;$('backLabel').textContent=w.back;$('back').href='./library-test.html';$('heading').textContent=p[0];$('narrative').textContent=p[1];$('prompt').textContent=p[2];$('count').textContent=w.page+' '+(idx+1)+' '+w.of+' 5';$('progress').style.width=(idx+1)*20+'%';$('prev').disabled=idx===0;$('next').disabled=idx===4;$('speakLabel').textContent=w.listen;$('nextLabel').textContent=idx===4?w.end:w.next;$('disclaimer').textContent=w.disclaimer;$('detail').textContent=w.detail;$('ru').setAttribute('aria-pressed',String(lang==='ru'));$('en').setAttribute('aria-pressed',String(lang==='en'));focus();}function turn(d){if(idx+d<0||idx+d>4)return;stop();idx+=d;render();}function setLang(l){stop();lang=l;history.replaceState(null,'','?lang='+l);render();}function read(){stop();if(!('speechSynthesis'in window))return;const p=pages[lang][idx];let u=new SpeechSynthesisUtterance(p[0]+'. '+p[1]+' '+p[2]);u.lang=lang==='ru'?'ru-RU':'en-US';u.rate=.87;speechSynthesis.speak(u)}$('prev').onclick=()=>turn(-1);$('next').onclick=()=>turn(1);$('lastNext').onclick=()=>idx===4?location.assign('./library-test.html'):turn(1);$('speak').onclick=read;$('ru').onclick=()=>setLang('ru');$('en').onclick=()=>setLang('en');let start;const sc=$('scene');sc.addEventListener('pointerdown',e=>{if(e.isPrimary)start=[e.clientX,e.clientY,e.pointerId]});sc.addEventListener('pointerup',e=>{if(!start||start[2]!==e.pointerId)return;let dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.35)turn(dx<0?1:-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();})();
</script></body></html>
