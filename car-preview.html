<script>const CAR_LOCAL_MODE = false; const BOOK_PAGES=[{"id":"c01","title":"Почему автомобили разные?","narration":"Легковая машина возит людей, грузовик перевозит грузы, а автобус — многих пассажиров. Поэтому у них разные кузова, двигатели, шасси и грузоподъёмность. Инженеры выбирают конструкцию под задачи автомобиля.","prompt":"Чем грузовик отличается от легковой машины?","diagram":"vehicles","tag":"Назначение и конструкция","en":{"title":"Why are cars different?","narration":"A passenger car carries people, a truck carries goods, and a bus carries many passengers. That is why they need different bodies, engines, chassis, and load capacities. Engineers choose the design to match each vehicle’s job.","prompt":"What makes a truck different from a passenger car?"}},{"id":"c02","title":"Бензин, дизель или электричество?","narration":"Бензиновый и дизельный двигатели — это двигатели внутреннего сгорания. Они получают энергию из топлива, но воспламеняют его по-разному. Электромобиль использует аккумулятор и электродвигатель. А гибрид сочетает двигатель внутреннего сгорания с электрической системой.","prompt":"Как ты думаешь, чем электромобиль отличается от дизельной машины?","diagram":"power","tag":"Типы силовых установок","en":{"title":"Petrol, diesel, or electricity?","narration":"Petrol and diesel engines are internal combustion engines. Both use fuel, but they ignite it in different ways. Electric cars use a battery and an electric motor. A hybrid combines a combustion engine with an electric drive system.","prompt":"How is an electric car different from a diesel car?"}},{"id":"c06","title":"Как работает двигатель?","narration":"В обычном поршневом двигателе внутреннего сгорания газы давят на поршень, а коленчатый вал превращает его движение во вращение. У электродвигателя принцип другой: магнитное поле заставляет вращаться ротор. Оба могут приводить машину в движение.","prompt":"Почему поршень движется вверх и вниз, а колёса вращаются?","diagram":"engine","tag":"ДВС и электродвигатель","en":{"title":"How does an engine work?","narration":"In a typical piston combustion engine, expanding gases push a piston. A crankshaft turns this up-and-down movement into rotation. An electric motor works differently: a magnetic field makes a rotor turn. Both can power a car.","prompt":"How can a moving piston make wheels turn?"}},{"id":"c03","title":"Что такое трансмиссия?","narration":"Двигатель создаёт крутящий момент — усилие, которое вращает вал. Трансмиссия передаёт этот момент к ведущим колёсам. В обычном автомобиле в неё могут входить коробка передач, валы, главная передача и дифференциал.","prompt":"Зачем нужна коробка передач?","diagram":"gearbox","tag":"Передача крутящего момента","en":{"title":"What is a transmission?","narration":"An engine produces torque—a twisting force that turns a shaft. The transmission transfers that torque to the driven wheels. In a conventional car, it may include a gearbox, shafts, final drive, and differential.","prompt":"Why does a car need a gearbox?"}},{"id":"c04","title":"Передний, задний и полный привод","narration":"У переднеприводной машины тяга передаётся передним колёсам, у заднеприводной — задним. Полный привод позволяет передавать её обеим осям. Это влияет на поведение автомобиля, особенно на скользкой дороге; многое зависит также от шин и условий.","prompt":"Какой привод ты выбрал бы для снежной дороги и почему?","diagram":"drive","tag":"Схемы привода","en":{"title":"Front, rear, and all-wheel drive","narration":"A front-wheel-drive car sends power to its front wheels; a rear-wheel-drive car sends it to the rear wheels. All-wheel drive can send power to both axles. This affects how a car behaves, especially on slippery roads; tyres matter too.","prompt":"Which drive layout might help on a snowy road, and why?"}},{"id":"c07","title":"Подвеска: комфорт и управление","narration":"Колёса соединены с кузовом через подвеску. Пружины или другие упругие элементы смягчают удары от неровностей, а амортизаторы гасят колебания. Шины должны сохранять сцепление с дорогой — это важно для поворота и торможения.","prompt":"Почему автомобиль подпрыгивает на кочках, но не должен долго раскачиваться?","diagram":"suspension","tag":"Устройство ходовой части","en":{"title":"Suspension: comfort and control","narration":"A suspension connects the wheels to the vehicle body. Springs absorb bumps, and shock absorbers reduce bouncing. Tyres need to stay in contact with the road so a car can steer and brake effectively.","prompt":"Why should a car stop bouncing after a bump?"}},{"id":"c08","title":"Тормоза и система ABS","narration":"Тормозные механизмы замедляют вращение колёс. В дисковом тормозе колодки прижимаются к диску. Система ABS помогает предотвращать длительную блокировку колёс при торможении, чтобы водитель лучше сохранял возможность управлять машиной.","prompt":"Что может произойти, если колёса перестанут вращаться на скользкой дороге?","diagram":"braking","tag":"Тормозная система","en":{"title":"Brakes and ABS","narration":"Brakes slow down the wheels. In a disc brake, pads press against a rotating disc. ABS helps prevent wheels from staying locked during hard braking, so the driver can better retain steering control.","prompt":"What can happen when wheels lock on a slippery road?"}},{"id":"c09","title":"Электроника и датчики","narration":"Современный автомобиль — это ещё и компьютерная система. Датчики измеряют скорость колёс, температуру и другие параметры. Электронные блоки управления обрабатывают сигналы и помогают работе двигателя, тормозов и систем безопасности.","prompt":"Как автомобиль узнаёт, с какой скоростью вращаются колёса?","diagram":"electronics","tag":"Датчики и управление","en":{"title":"Electronics and sensors","narration":"Modern cars also contain computer systems. Sensors measure wheel speed, temperature, and other signals. Electronic control units use the information to help manage the engine, brakes, and safety systems.","prompt":"How does a car know how fast each wheel is turning?"}},{"id":"c10","title":"Почему машины выбирают по-разному?","narration":"Для перевозки тяжёлого груза важны грузоподъёмность и прочная конструкция. Для города — размеры, экономичность и удобство. Для сложных дорог могут понадобиться подходящие шины, дорожный просвет и полный привод. Одного «лучшего автомобиля» для всех задач не существует.","prompt":"Какую машину ты придумал бы для путешествия в горы?","diagram":"choice","tag":"Инженерная задача","en":{"title":"Different cars for different jobs","narration":"A heavy-duty vehicle needs a strong structure and enough payload capacity. In cities, compact dimensions and efficiency can matter more. On difficult roads, suitable tyres, ground clearance, and all-wheel drive may help. There is no single best car for every task.","prompt":"What would you design for a trip into the mountains?"}},{"id":"c05","title":"Безопасность — часть конструкции","narration":"Ремни безопасности, подушки и детские удерживающие устройства помогают защищать людей при аварии. Тормоза, освещение и системы помощи водителю помогают снижать риск опасных ситуаций. Настоящую машину водит только человек, имеющий на это право.","prompt":"Почему безопасность продумывают ещё при проектировании автомобиля?","diagram":"safety","tag":"Безопасность автомобиля","en":{"title":"Safety is part of design","narration":"Seat belts, airbags, and appropriate child restraints help protect people in a crash. Brakes, lighting, and driver-assistance systems help reduce some risks. Only someone legally permitted to drive should operate a real car.","prompt":"Why do engineers plan safety from the very beginning?"}}];</script>

 function stopSpeech(){if('speechSynthesis' in window)speechSynthesis.cancel()}function say(txt){stopSpeech();if(!('speechSynthesis' in window))return;const utter=new SpeechSynthesisUtterance(txt);utter.lang=state.lang==='en'?'en-US':'ru-RU';utter.rate=.86;speechSynthesis.speak(utter)}

 function turn(d){const n=state.index+d;if(n<0||n>=BOOK_PAGES.length)return;stopSpeech();state.index=n;render()}function setLang(l){stopSpeech();state.lang=l;try{localStorage.setItem('kniga_language',l)}catch(_){}try{history.replaceState(null,'','?lang='+l)}catch(_){}render()}

 function closeChat(){state.opened=false;$('drawer').hidden=true;$('askOpen').setAttribute('aria-expanded','false')}
 async function submitQuestion(q){if(state.busy)return;const a=ui[state.lang];if(q.trim().length<3)return;bubble(q,'kid');$('question').value='';if(!state.local){bubble(a.noPublic,'agent');return}state.busy=true;$('send').disabled=true;$('chatStatus').textContent=a.status;try{await initBackend();const response=await jsonFetch('/api/v1/car/chat','POST',{session_id:state.sid,page_id:BOOK_PAGES[state.index].id,question:q,recent_turns:state.history.slice(-2)});bubble(response.answer,'agent');state.history.push({question:q,answer:response.answer});if(state.history.length>2)state.history.shift();if(response.page_id&&response.page_id!==BOOK_PAGES[state.index].id){const i=BOOK_PAGES.findIndex(p=>p.id===response.page_id);if(i>=0){const target=BOOK_PAGES[i],tip=$('navigationTip');tip.hidden=false;tip.textContent='';tip.append(document.createTextNode(a.see+' «'+content(target).title+'» — '));const button=document.createElement('button');button.className='link';button.type='button';button.textContent=a.got;button.onclick=()=>{state.index=i;render();tip.hidden=true;closeChat()};tip.append(button)}}if(state.lang==='ru')say(response.answer);$('chatStatus').textContent=a.ready}catch(e){bubble(a.noServer,'agent');$('chatStatus').textContent=(e&&e.message)||a.noServer}finally{state.busy=false;$('send').disabled=false}}

 let swipe=null;const scene=$('scene');scene.addEventListener('pointerdown',e=>{if(e.isPrimary&&(e.pointerType!=='mouse'||e.button===0))swipe={x:e.clientX,y:e.clientY,id:e.pointerId}});scene.addEventListener('pointerup',e=>{if(!swipe||swipe.id!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.abs(dx)>62&&Math.abs(dx)>Math.abs(dy)*1.35)turn(dx<0?1:-1)});scene.addEventListener('pointercancel',()=>swipe=null);
